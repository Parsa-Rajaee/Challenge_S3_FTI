[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc311-data-factory"
version = "0.1.0"
description = "A reproducible, resumable NYC 311 data factory"
requires-python = ">=3.11"
dependencies = [
    "requests==2.32.5",
    "pandas==2.3.3",
    "matplotlib==3.10.8",
]

[project.scripts]
nyc311-factory = "nyc311_factory.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
