[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="fti-capstone"
version="0.1.0"
requires-python=">=3.11"
dependencies=["numpy>=1.26,<3","pandas>=2.1,<3","scikit-learn>=1.4,<2","SQLAlchemy>=2,<3","psycopg2-binary>=2.9,<3","joblib>=1.3"]
[project.scripts]
fti-capstone="capstone.runner:main"
[tool.setuptools.packages.find]
where=["."]
include=["capstone*"]
