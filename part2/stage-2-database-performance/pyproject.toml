[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc311-database-performance"
version = "0.1.0"
description = "Olist PostgreSQL schema, loader, and performance experiments"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.3.3",
    "SQLAlchemy==2.0.36",
    "psycopg2-binary==2.9.9",
        "matplotlib==3.10.8",
]

[project.scripts]
nyc311-db = "database_performance.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
