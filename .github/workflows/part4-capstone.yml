name: Part 4 capstone verification
on:
  pull_request:
    paths: ['part4/**', 'src/nyc311_factory/olist.py', '.github/workflows/part4-capstone.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: postgres
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/capstone
      CAPSTONE_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/synthetic
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packages and create empty databases
        run: |
          pip install -e . -e ./part2/stage-2-database-performance -e ./part4 pytest nbconvert ipykernel
          for db in capstone regression synthetic; do createdb -h localhost -U postgres "$db"; done
      - name: Run the four test suites
        run: |
          python -m pytest -q tests
          DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/regression nyc311-db init-db
          DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/regression python -m pytest -q part2/stage-2-database-performance/tests
          env -u DATABASE_URL PYTHONPATH=part3/stage-3-machine-learning/src python -m pytest -q part3/stage-3-machine-learning/tests
          python -m pytest -q part4/tests
      - name: Build with public Olist data
        run: |
          curl --fail --location --retry 3 https://www.kaggle.com/api/v1/datasets/download/olistbr/brazilian-ecommerce --output "$RUNNER_TEMP/olist.zip"
          unzip -q "$RUNNER_TEMP/olist.zip" -d "$RUNNER_TEMP/olist"
          fti-capstone build --raw-dir "$RUNNER_TEMP/olist"
          jupyter nbconvert --to notebook --execute --inplace part4/*.ipynb
      - uses: actions/upload-artifact@v4
        with:
          name: capstone-evidence
          path: |
            part4/*.ipynb
            part4/artifacts/*.md
            part4/artifacts/*.json
          if-no-files-found: error
